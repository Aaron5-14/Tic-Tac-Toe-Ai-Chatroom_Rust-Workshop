[package]
name = "tictactoe-ai-chatroom-rust-workshop"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
macroquad = "0.4.16"
mpsc = "0.3.0"
rig = "0.41.0"
